<style>

button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
.shell{max-width:1170px;margin:auto;padding:28px 28px 95px}header{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:31px}.brand{display:flex;align-items:center;gap:12px}.logo{background:var(--accent);border-radius:14px;color:#15221b;font-weight:1000;width:43px;height:43px;display:grid;place-items:center;font-size:24px;letter-spacing:-3px;padding-right:3px}.brand-name{font-size:20px;font-weight:900;letter-spacing:.14em}.brand-sub{font-size:10px;color:var(--muted);letter-spacing:.19em;text-transform:uppercase}.topnav{display:flex;gap:6px;background:#151d1a;border:1px solid var(--border);border-radius:16px;padding:5px}.topnav button{background:none;color:var(--muted);padding:10px 16px;border:0;border-radius:11px;font-weight:700;font-size:13px}.topnav button.active{background:#35433b;color:var(--ink)}.tag{font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:var(--muted)}
h1{font-size:clamp(32px,5vw,58px);line-height:1.02;letter-spacing:-.05em;margin:8px 0 12px;font-weight:830}h1 em{color:var(--accent);font-style:normal}h2{font-size:23px;margin:0;letter-spacing:-.032em}h3{font-size:17px;margin:0}p{margin:8px 0;color:var(--muted)}.eyebrow{font-size:11px;letter-spacing:.18em;color:var(--accent);text-transform:uppercase;font-weight:850}.hero{display:flex;align-items:end;justify-content:space-between;gap:25px;margin-bottom:24px}.hero p{max-width:630px}.hero .target{color:var(--muted);font-size:12px;max-width:210px;text-align:right}.target strong{display:block;font-size:27px;color:var(--ink);letter-spacing:-.035em}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:24px}.stat,.card{background:var(--panel);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow)}.stat{padding:20px 18px}.stat b{font-size:27px;display:block;letter-spacing:-.045em;margin-top:7px}.stat small{font-size:11px;color:var(--muted)}.stat b span{font-size:14px;letter-spacing:0;color:var(--muted);font-weight:500}.card{padding:22px}.flex{display:flex;justify-content:space-between;align-items:center;gap:12px}.sub{color:var(--muted);font-size:13px}.rule{height:1px;background:var(--border);margin:18px 0}.muted{color:var(--muted)}.date-label{color:var(--muted);font-size:12px}.weekbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.weekbar h2{min-width:175px}.btn,.ghost,.iconbtn{border:1px solid var(--border);border-radius:12px;background:var(--panel2);color:var(--ink);padding:11px 15px;font-weight:700;font-size:13px}.btn.primary{background:var(--accent);color:#142019;border-color:var(--accent)}.btn:hover,.ghost:hover,.iconbtn:hover{filter:brightness(1.12)}.btn:disabled{opacity:.4;cursor:not-allowed}.btn.secondary{background:transparent}.btn.tiny{padding:7px 10px;font-size:12px}.iconbtn{padding:10px 13px}.weekdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;margin-top:20px}.day{min-height:124px;background:var(--panel2);border:1px solid var(--border);border-radius:15px;padding:13px 11px;text-align:left;color:var(--ink);transition:background .1s,border .1s;display:flex;flex-direction:column;gap:6px}.day:hover{background:#2c3932}.day.selected{border-color:var(--accent);background:#2b392d}.day .daytop{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);letter-spacing:.06em;font-weight:700}.day .num{font-size:22px;font-weight:800}.day .kind{font-size:10px;color:var(--muted);line-height:1.3;margin-top:auto}.day .dot{height:7px;width:7px;background:#587466;border-radius:50%;display:inline-block}.day .dot.done{background:var(--accent);box-shadow:0 0 0 3px #d9f38b21}.day .dot.skip{background:var(--red)}.layout{display:grid;grid-template-columns:minmax(0,1.85fr) minmax(260px,.95fr);gap:16px;margin-top:16px;align-items:start}.panel-title{display:flex;justify-content:space-between;gap:15px;align-items:start;margin-bottom:15px}.note{border-left:2px solid var(--accent);background:#d9f38b0c;color:#bdcdbf;padding:10px 12px;border-radius:0 9px 9px 0;font-size:12px;margin:10px 0}.warning{border-left-color:var(--red);background:#f0aa9a0b}.rowline{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}.rowline:last-child{border-bottom:0}.pill{font-size:11px;padding:5px 9px;border-radius:99px;font-weight:800;display:inline-block;background:#344c40;color:#cce3cf}.pill.run{background:#263e55;color:#bcd8f5}.pill.rest{background:#333933;color:#b5bcb2}.pill.done{background:#d9f38b26;color:var(--accent)}.pill.red{background:#754d42;color:#f1c5b2}.stack{display:flex;flex-direction:column;gap:13px}.field{display:flex;flex-direction:column;gap:6px}.field label,.fieldlabel{font-size:11px;letter-spacing:.04em;color:var(--muted);font-weight:700}.input{background:#101b17;border:1px solid #425147;border-radius:10px;padding:11px 12px;color:var(--ink);width:100%;min-width:0;outline:0}.input:focus{border-color:var(--accent)}input[type=number]{font-variant-numeric:tabular-nums}textarea.input{resize:vertical;min-height:68px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.formgrid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.workoutlist{display:flex;flex-direction:column;gap:11px}.exercise{background:#151e1a;border:1px solid var(--border);border-radius:16px;padding:16px}.exhead{display:flex;justify-content:space-between;gap:8px;align-items:start}.ex-title{font-size:16px;font-weight:750}.ex-meta{font-size:12px;color:var(--muted);margin-top:3px}.recommend{padding:10px 12px;margin:12px 0;background:#26392e;border-radius:11px;display:flex;align-items:center;justify-content:space-between;gap:10px}.recommend b{color:var(--accent);font-size:18px}.recommend .why{color:#b5c4b5;font-size:11px;max-width:280px;text-align:right}.setrow{display:grid;grid-template-columns:44px 1fr 1fr;gap:10px;align-items:center;margin-bottom:8px}.setrow .setno{font-size:11px;color:var(--muted);font-weight:800}.effort{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:end;margin-top:10px}.exlinks{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:12px;font-weight:650}.exlinks a{display:inline-flex;align-items:center;gap:4px}.bottom-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:17px}.check{display:flex;gap:9px;align-items:center;color:var(--muted);font-size:12px}.check input{accent-color:#d9f38b}.insight{background:#243329;padding:13px;border-radius:12px;margin-top:13px}.insight strong{color:var(--accent)}.chart{width:100%;max-width:100%;height:180px}.section-intro{margin-bottom:22px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.progress-list{display:flex;flex-direction:column;gap:10px}.logrow{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--border);border-radius:11px;padding:10px 13px}.bar{height:7px;border-radius:99px;background:#405048;overflow:hidden}.barfill{height:100%;background:var(--accent);border-radius:99px}.toast{position:fixed;z-index:999;bottom:20px;left:50%;transform:translateX(-50%);background:var(--accent);color:#132015;border-radius:12px;padding:12px 18px;font-size:13px;font-weight:850;box-shadow:var(--shadow);max-width:90%;text-align:center}.hide{display:none!important}.foot{font-size:11px;color:var(--muted);margin-top:25px;text-align:center}.smallhead{font-weight:750;font-size:13px;color:var(--ink)}.machine-guide{color:var(--muted);font-size:12px;margin:8px 0}.mobile-nav{display:none}.thin{font-weight:400}.space{height:10px}.all-link{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--accent);font-weight:800}.mobile-hint{display:none}
@media(max-width:800px){.shell{padding:18px 15px 95px}.topnav{display:none}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#121d18f7;border-top:1px solid var(--border);z-index:300;justify-content:space-around;padding:9px 8px max(9px,env(safe-area-inset-bottom))}.mobile-nav button{border:0;background:none;color:var(--muted);font-size:11px;font-weight:800;min-width:70px;padding:8px 5px}.mobile-nav button.active{color:var(--accent)}.mobile-nav .sym{display:block;font-size:18px;margin-bottom:3px}.hero{align-items:start}.hero .target{display:none}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat{padding:16px}.stat b{font-size:23px}.weekdays{grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.day{padding:10px 4px;min-height:89px;text-align:center}.day .num{font-size:18px}.day .kind{font-size:8px;letter-spacing:-.04em;overflow-wrap:anywhere}.day .daytop{font-size:9px;justify-content:center;flex-direction:column;align-items:center;gap:3px}.day .daytop span:first-child{display:block}.layout{grid-template-columns:1fr}.card{padding:18px}.mobile-hint{display:block}}
@media(max-width:390px){.weekdays{gap:4px}.day .num{font-size:16px}.day{min-height:78px}.day .kind{font-size:7px}.formgrid.three{grid-template-columns:1fr 1fr}.stat{padding:14px}.logo{width:38px;height:38px}.brand-name{font-size:18px}}
</style>

<body>
<div id="app" class="shell"></div><div id="toast" class="toast hide" role="status" aria-live="polite"></div>
<script>
'use strict';
const START='2026-10-25', KEY='form_tracker_v1', DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const EX={
 chest:{name:'Machine chest press',group:'Chest',rep:[8,12],step:5,trial:20,tip:'Handles at mid-chest; back supported, shoulders down. Stop before any painful stretch.',video:'https://www.youtube.com/watch?v=sqNwDkUU_Ps',guide:'https://www.puregym.com/exercises/chest/bench-press/seated-chest-press/'},
 row:{name:'Seated row machine',group:'Back',rep:[8,12],step:5,trial:25,tip:'Keep your chest supported; pull elbows back without swinging your torso.',video:'https://www.youtube.com/watch?v=TeFo51Q_Nsc',guide:'https://www.puregym.com/lets-get-started/workout-builder/equipment-how-tos/'},
 incline:{name:'Incline chest press machine',group:'Upper chest',rep:[8,12],step:5,trial:15,tip:'Use a low-to-moderate incline; press in a comfortable path without forcing your shoulders.',video:'https://www.youtube.com/watch?v=sqNwDkUU_Ps',videoNote:'General machine press demonstration; incline setup will differ.',guide:'https://www.puregym.com/exercises/chest/bench-press/seated-chest-press/'},
 lat:{name:'Lat pulldown',group:'Back',rep:[8,12],step:5,trial:25,tip:'Brace thighs, pull toward upper chest and control the return; avoid yanking.',video:'https://www.youtube.com/watch?v=JGeRYIZdojU',guide:'https://www.puregym.com/exercises/back/lat-exercises/lat-pulldown/'},
 legpress:{name:'Seated leg press',group:'Legs',rep:[10,12],step:10,trial:40,tip:'Feet flat; lower only as far as your back remains supported; avoid locking knees.',video:'https://www.youtube.com/watch?v=qCR9bN3G1t4',guide:'https://www.puregym.com/exercises/legs/quad-exercises/leg-presses/seated-leg-press/'},
 legcurl:{name:'Seated leg curl',group:'Hamstrings',rep:[10,12],step:5,trial:20,tip:'Adjust ankle and thigh pads; keep hips planted and curl smoothly.',video:null,guide:'https://www.puregym.com/exercises/legs/hamstring-exercises/hamstring-curls/seated-leg-curl/',extraVideo:'https://www.youtube.com/watch?v=QjNFk4F5dAs',extraVideoNote:'Watch alternative: prone leg curl (different machine setup).'},
 triceps:{name:'Cable triceps pushdown',group:'Arms',rep:[10,15],step:5,trial:10,tip:'Upper arms close to sides, elbows stationary; extend without shoulder swinging.',video:'https://www.youtube.com/watch?v=LXkCrxn3caQ',guide:'https://www.puregym.com/exercises/arms-and-shoulders/tricep-extension/tricep-pushdowns/'},
 fly:{name:'Pec deck / machine fly',group:'Chest',rep:[10,15],step:5,trial:15,tip:'Keep shoulders supported and elbows softly bent; avoid a deep painful stretch.',video:'https://www.youtube.com/watch?v=eGjt4lk6g34',guide:'https://www.puregym.com/exercises/chest/chest-fly/machine-fly/'},
 lateral:{name:'Cable lateral raise',group:'Shoulders',rep:[12,15],step:2.5,trial:5,tip:'Raise smoothly to about shoulder height without momentum; do both sides.',video:null,guide:'https://www.puregym.com/exercises/arms-and-shoulders/lateral-raises/cable-lateral-raise/',videoSearch:'https://www.youtube.com/results?search_query=PureGym+cable+lateral+raise'},
 biceps:{name:'Cable biceps curl',group:'Arms',rep:[10,15],step:5,trial:10,tip:'Elbows by sides, wrists neutral, and no rocking; control each lowering.',video:'https://www.youtube.com/watch?v=GNlopToAZyg',guide:'https://www.puregym.com/exercises/arms-and-shoulders/bicep-curl/cable-bicep-curls/'}
};
const PLANS={A:[['chest',3],['row',3],['incline',2],['lat',2],['legpress',2],['legcurl',2],['triceps',2]],B:[['incline',3],['lat',3],['fly',2],['row',2],['lateral',2],['legpress',2],['legcurl',2],['biceps',2]]};
const SCHEDULE=[{name:'Just Run',kind:'run',mark:'RUN'},{name:'Strength A + Row',kind:'strength',plan:'A',mark:'LIFT'},{name:'Just Run',kind:'run',mark:'RUN'},{name:'Recovery',kind:'rest',mark:'REST'},{name:'Strength B + Row',kind:'strength',plan:'B',mark:'LIFT'},{name:'Just Run',kind:'run',mark:'RUN'},{name:'Recovery',kind:'rest',mark:'REST'}];
const dayMS=86400000;
function iso(d){return new Date(d).toISOString().slice(0,10)}
function dateAdd(ymd,n){return iso(new Date(ymd+'T12:00:00Z').getTime()+n*dayMS)}
function dateObj(ymd){return new Date(ymd+'T12:00:00Z')}
function pretty(ymd,opt={month:'short',day:'numeric'}){return dateObj(ymd).toLocaleDateString('en-US',{timeZone:'UTC',...opt})}
function longDate(ymd){return pretty(ymd,{month:'long',day:'numeric',year:'numeric',weekday:'long'})}
function defaultState(){return {logs:{'2026-10-25':{done:true,run:{speed:'4.5',notes:'First Just Run session completed; 4 mph felt too slow, increased intervals to 4.5 mph.'}}},weighIns:[],trial:{},paused:false}}
function load(){try {let o=JSON.parse(localStorage.getItem(KEY)); if(o&&typeof o==='object'&&o.logs&&Array.isArray(o.weighIns))return o}catch(e){}return defaultState()}
let state=load();state.trial??={};state.paused??=false;
const localNow=new Date(); const nowToday=[localNow.getFullYear(),String(localNow.getMonth()+1).padStart(2,"0"),String(localNow.getDate()).padStart(2,"0")].join("-");
const weeksSince=Math.floor((dateObj(nowToday)-dateObj(START))/dayMS/7);
let week=Math.max(0,Math.min(51,weeksSince));let selected=nowToday>=START?nowToday:START;let tab='today';let toastTimer=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){notice('Could not save locally — export your data.') }}
function getLog(d){return state.logs[d]||{}}
function ensure(d){state.logs[d]??={};return state.logs[d]}
function template(d){let offset=Math.round((dateObj(d)-dateObj(START))/dayMS);let idx=((offset%7)+7)%7;return SCHEDULE[idx]}
function runNumber(d){const offset=Math.round((dateObj(d)-dateObj(START))/dayMS);return Math.floor(offset/7)*3 + ({0:1,2:2,5:3}[offset%7]||0)}
function setDate(d){selected=d;week=Math.max(0,Math.floor(Math.round((dateObj(d)-dateObj(START))/dayMS)/7)); tab='today';render();document.querySelector('.workout-panel')?.scrollIntoView({behavior:'smooth',block:'nearest'})}
function e(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function progress(){let wkStart=dateAdd(START,week*7), count=0;for(let i=0;i<7;i++){if(getLog(dateAdd(wkStart,i)).done)count++}return count}
function notice(msg){let t=document.getElementById('toast');t.textContent=msg;t.classList.remove('hide');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.add('hide'),2800)}
function allDone(kind){return Object.entries(state.logs).filter(([d,l])=>l.done&&template(d).kind===kind).length}
function pastHistory(id,d){let arr=[];Object.entries(state.logs).forEach(([date,l])=>{if(date>=d||!l.done||!l.strength?.[id])return;const x=l.strength[id];const filled=(x.sets||[]).filter(s=>Number(s.weight)>=0&&s.weight!==''&&Number(s.reps)>0);if(filled.length)arr.push({date,sets:filled,effort:x.effort||'right'})});return arr.sort((a,b)=>b.date.localeCompare(a.date))}
function roundStep(n,step){return Math.max(step,Math.round(n/step)*step)}
function recommended(id,d){const x=EX[id],trial=Number(state.trial[id]??x.trial);const hist=pastHistory(id,d);if(!hist.length)return {weight:trial,kind:'trial',why:'First-session test load · adjust before your first set'};let last=hist[0];let base=Number(last.sets[last.sets.length-1].weight);let reps=last.sets.map(s=>Number(s.reps));let allTop=reps.every(v=>v>=x.rep[1]);let low=reps.some(v=>v<x.rep[0]);let newWeight=base,label='Hold last weight',kind='hold';if(last.effort==='pain'){newWeight=base;label='Pause and review discomfort',kind='pain'}else if(low||last.effort==='hard'){newWeight=Math.max(x.step,base-x.step);label='Reduce one machine increment',kind='down'}else if(allTop&&last.effort!=='hard'){newWeight=base+x.step;label='All reps achieved · increase one increment',kind='up'}else{label='Stay here until all sets reach top of rep range'}return {weight:roundStep(newWeight,x.step),why:label,kind,previous:base,date:last.date}}
function navButton(which,text){return `<button data-nav="${which}" class="${tab===which?'active':''}">${text}</button>`}
function header(){return `<header><div class="brand"><div class="logo">F</div><div><div class="brand-name">FORM</div><div class="brand-sub">A little stronger every day</div></div></div><nav class="topnav" aria-label="Main navigation">${navButton('today','My week')}${navButton('progress','Progress')}${navButton('library','Exercises')}${navButton('settings','Settings')}</nav><span class="tag" style="text-align:right">TRAINING JOURNAL<br>EST. 25 OCT 2026</span></header>`}
function bottomNav(){return `<nav class="mobile-nav" aria-label="Mobile navigation">${[['today','◫','My week'],['progress','↗','Progress'],['library','▤','Exercises'],['settings','⚙','Settings']].map(([k,i,l])=>`<button class="${tab===k?'active':''}" data-nav="${k}"><span class="sym">${i}</span>${l}</button>`).join('')}</nav>`}
function miniStats(){let total=Object.values(state.logs).filter(v=>v.done).length, weight=state.weighIns.length?state.weighIns[state.weighIns.length-1].weight:null;return `<section class="stats"><div class="stat"><div class="tag">Sessions logged</div><b>${total}</b><small>All completed activities</small></div><div class="stat"><div class="tag">Run workouts</div><b>${allDone('run')}<span> / 27 C25K</span></b><small>Three Just Run days / week</small></div><div class="stat"><div class="tag">Strength days</div><b>${allDone('strength')}</b><small>Two full-body days / week</small></div><div class="stat"><div class="tag">Last weigh-in</div><b>${weight??'—'}<span>${weight?' lb':''}</span></b><small>Goal: 150 lb · Starting reference: ~175 lb</small></div></section>`}
function weekPanel(){let start=dateAdd(START,week*7),end=dateAdd(start,6),count=progress();return `<div class="card"><div class="flex"><div><div class="eyebrow">Your training calendar</div><h2>Week ${week+1} <span class="thin muted" style="font-size:14px">${pretty(start)} – ${pretty(end)}</span></h2></div><div class="weekbar"><button class="iconbtn" data-week="-1" ${week===0?'disabled':''} title="Previous week">‹</button><button class="iconbtn" data-week="1" title="Next week">›</button></div></div><div class="bar" style="margin-top:17px"><div class="barfill" style="width:${count/7*100}%"></div></div><div class="flex" style="margin-top:7px"><div class="sub">${count} of 7 days checked · Recovery is a valid workout-day choice</div><button class="btn tiny secondary" data-today="1">Jump to today</button></div><div class="weekdays">${Array.from({length:7},(_,i)=>{let d=dateAdd(start,i),p=SCHEDULE[i],l=getLog(d);return `<button class="day ${selected===d?'selected':''}" data-date="${d}"><div class="daytop"><span>${DOW[i]}</span><span class="dot ${l.done?'done':l.skipped?'skip':''}"></span></div><div class="num">${pretty(d,{day:'numeric'})}</div><div class="kind">${p.mark}${p.kind==='run'?` #${runNumber(d)}`:p.plan?' '+p.plan:''}</div></button>`}).join('')}</div></div>`}
function exerciseCard(id,setsCount,d){let x=EX[id],log=getLog(d).strength?.[id]||{},rec=recommended(id,d),firstTwo=Math.floor((dateObj(d)-dateObj(START))/dayMS/7)<2,sets=firstTwo?Math.min(2,setsCount):setsCount;let rows=Array.from({length:sets},(_,i)=>{let s=log.sets?.[i]||{};return `<div class="setrow"><span class="setno">SET ${i+1}</span><div class="field"><label for="w-${id}-${i}">Weight (lb)</label><input class="input" id="w-${id}-${i}" type="number" inputmode="decimal" min="0" step="${x.step}" value="${e(s.weight??rec.weight)}" data-lift="${id}" data-set="${i}" data-field="weight"></div><div class="field"><label for="r-${id}-${i}">Reps (${x.rep[0]}–${x.rep[1]})</label><input class="input" id="r-${id}-${i}" type="number" inputmode="numeric" min="0" max="100" placeholder="—" value="${e(s.reps??'')}" data-lift="${id}" data-set="${i}" data-field="reps"></div></div>`}).join('');return `<section class="exercise"><div class="exhead"><div><div class="ex-title">${e(x.name)}</div><div class="ex-meta">${x.group} · ${sets} × ${x.rep[0]}–${x.rep[1]} reps</div></div><span class="pill">${rec.kind==='trial'?'CALIBRATE':rec.kind==='up'?'INCREASE':rec.kind==='down'?'LIGHTER':rec.kind==='pain'?'REVIEW':'HOLD'}</span></div><div class="recommend"><div><div class="tag">${rec.kind==='trial'?'Suggested test weight':'Next workout target'}</div><b>${rec.weight} lb</b></div><div class="why">${e(rec.why)}</div></div><div class="machine-guide">${e(x.tip)}</div>${rows}<div class="effort"><div class="field"><label>After final set</label><select class="input" data-effort="${id}"><option value="right" ${!log.effort||log.effort==='right'?'selected':''}>Comfortable · 2–3 reps left</option><option value="easy" ${log.effort==='easy'?'selected':''}>Too easy · 4+ reps left</option><option value="hard" ${log.effort==='hard'?'selected':''}>Too hard · 0–1 reps left</option><option value="pain" ${log.effort==='pain'?'selected':''}>Pain / discomfort</option></select></div><div class="field"><label>Starting test weight (lb)</label><input class="input" aria-label="Edit first trial weight for ${e(x.name)}" data-trial="${id}" type="number" min="0" step="${x.step}" value="${e(state.trial[id]??x.trial)}"></div></div><div class="exlinks"><a target="_blank" rel="noopener noreferrer" href="${e(x.video||x.extraVideo||x.videoSearch||x.guide)}">↗ ${x.video?'Watch PureGym on YouTube':x.extraVideo?'YouTube: prone variation':'Search PureGym on YouTube'}</a><a target="_blank" rel="noopener noreferrer" href="${e(x.guide)}">Form guide</a></div>${x.videoNote?`<div class="sub" style="margin-top:5px">${e(x.videoNote)}</div>`:''}${x.extraVideoNote?`<div class="sub" style="margin-top:5px">${e(x.extraVideoNote)}</div>`:''}</section>`}
function rowCard(d){let l=getLog(d).rowing||{};return `<div class="rule"></div><div class="flex"><div><h3>Easy rowing after lifting</h3><p class="sub">Optional 10–15 min. Progress in Start Rowing separately, and stay conversational.</p></div><span class="pill">OPTIONAL</span></div><div class="formgrid"><div class="field"><label>Minutes</label><input class="input" type="number" min="0" step="1" placeholder="e.g. 10" data-field-log="rowing.minutes" value="${e(l.minutes??'')}"></div><div class="field"><label>Distance (meters, optional)</label><input class="input" type="number" min="0" placeholder="—" data-field-log="rowing.distance" value="${e(l.distance??'')}"></div></div>`}
function strengthPanel(d,p,l){let w=Math.floor(Math.round((dateObj(d)-dateObj(START))/dayMS)/7)+1;return `<div class="card workout-panel"><div class="panel-title"><div><div class="eyebrow">${pretty(d,{weekday:'long',month:'long',day:'numeric'})}</div><h2>Strength ${p.plan}</h2><p class="sub">Machine-based full body · Upper-body emphasis · ~40–50 min</p></div><span class="pill ${l.done?'done':''}">${l.done?'✓ COMPLETE':'LOG WORKOUT'}</span></div><div class="note ${w<3?'':'warning'}">${w<3?'Weeks 1–2: start with up to two working sets per lift.':'Progression phase: use the prescribed working sets, leaving 2–3 reps in reserve.'} Weight suggestions are starting tests, not strength assessments. Begin lighter if unsure, and use the same machine to track progress.</div><div class="workoutlist">${PLANS[p.plan].map(([id,n])=>exerciseCard(id,n,d)).join('')}</div>${rowCard(d)}<div class="rule"></div><div class="field"><label>Workout notes</label><textarea class="input" data-field-log="notes" placeholder="Machine settings, comfort, how the workout felt...">${e(l.notes??'')}</textarea></div><div class="bottom-actions"><button class="btn primary" data-finish="1">${l.done?'Update completed workout':'Finish strength workout'}</button><button class="btn secondary" data-skip="1">${l.skipped?'Unskip this day':'Skip / recovery instead'}</button></div></div>`}
function runPanel(d,l){let r=l.run||{},count=runNumber(d);return `<div class="card workout-panel"><div class="panel-title"><div><div class="eyebrow">${pretty(d,{weekday:'long',month:'long',day:'numeric'})}</div><h2>Just Run <span class="thin muted">#${count}</span></h2><p class="sub">Follow the intervals in the Just Run app · Walk / run workout</p></div><span class="pill ${l.done?'done':'run'}">${l.done?'✓ COMPLETE':'CARDIO'}</span></div><div class="note">Build continuous running before chasing speed. Your eventual benchmark is 2 miles in 20 minutes (6.0 mph). A controlled 4.5–5.0 mph run interval is a reasonable learning pace—not a required speed.</div><div class="formgrid three"><div class="field"><label>Running speed (mph)</label><input class="input" type="number" step="0.1" min="0" placeholder="e.g. 4.5" value="${e(r.speed??'')}" data-field-log="run.speed"></div><div class="field"><label>Total time (minutes)</label><input class="input" type="number" step="1" min="0" placeholder="—" value="${e(r.minutes??'')}" data-field-log="run.minutes"></div><div class="field"><label>Distance (miles, optional)</label><input class="input" type="number" step="0.01" min="0" placeholder="—" value="${e(r.distance??'')}" data-field-log="run.distance"></div></div><div class="formgrid" style="margin-top:12px"><div class="field"><label>Longest continuous run (minutes)</label><input class="input" type="number" step="0.5" min="0" placeholder="—" value="${e(r.continuous??'')}" data-field-log="run.continuous"></div><div class="field"><label>Session felt</label><select class="input" data-field-log="run.feel">${[['','Not selected'],['easy','Easy'],['steady','Comfortable'],['hard','Hard'],['pain','Pain / unusual symptoms']].map(([k,t])=>`<option value="${k}" ${r.feel===k?'selected':''}>${t}</option>`).join('')}</select></div></div><div class="field" style="margin-top:13px"><label>Notes</label><textarea class="input" data-field-log="run.notes" placeholder="How did the intervals feel?">${e(r.notes??'')}</textarea></div><div class="bottom-actions"><button class="btn primary" data-finish="1">${l.done?'Update completed run':'Complete Just Run session'}</button><button class="btn secondary" data-skip="1">${l.skipped?'Unskip this day':'Skip / recovery instead'}</button></div></div>`}
function restPanel(d,l){return `<div class="card workout-panel"><div class="panel-title"><div><div class="eyebrow">${pretty(d,{weekday:'long',month:'long',day:'numeric'})}</div><h2>Recover well.</h2><p class="sub">Rest, easy walking, hydration, and sleep all count.</p></div><span class="pill rest">REST DAY</span></div><p>Your week includes two built-in recovery days. If you're sore or worn down, reduce another workout's intensity rather than forcing it.</p><div class="bottom-actions"><button class="btn primary" data-finish="1">${l.done?'✓ Recovery logged':'Mark recovery complete'}</button></div></div>`}
function upcoming(){let ref=dateAdd(START,week*7);return `<div class="card"><div class="eyebrow">Your bigger picture</div><h3 style="margin-top:8px">Build the habit first.</h3><p>Two strength days. Three Just Run days. Easy rowing after weights when recovered.</p><div class="rule"></div><div class="rowline"><div><div class="smallhead">Strength emphasis</div><div class="sub">Chest • shoulders • back</div></div><span class="pill">2×/wk</span></div><div class="rowline"><div><div class="smallhead">Run benchmark</div><div class="sub">2 mi in 20 min</div></div><span class="pill run">6.0 mph</span></div><div class="rowline"><div><div class="smallhead">Body composition</div><div class="sub">175 → 150 lb goal</div></div><span class="pill">Slow + steady</span></div><div class="rule"></div><div class="tag">Medical scheduling</div><p class="sub">Thyroidectomy planned for Dec 1. Pause strenuous workouts around surgery as instructed by your care team. Do not push through chest-wall pain or unusual breathlessness.</p></div>`}
function todayView(){let p=template(selected),l=getLog(selected);return `<div class="hero"><div><div class="eyebrow">Your 12-week training journal</div><h1>Build your <em>base.</em></h1><p>Three runs. Two upper-body-biased lifts. Flexible rowing. One honest log at a time.</p></div><div class="target">THE RUNNING GOAL <strong>2 mi / 20 min</strong>Make it comfortable, not a daily race.</div></div>${miniStats()}${weekPanel()}<div class="layout">${p.kind==='strength'?strengthPanel(selected,p,l):p.kind==='run'?runPanel(selected,l):restPanel(selected,l)}${upcoming()}</div>`}
function trendSVG(points,fill=false,minY,maxY){if(!points.length)return '<div class="sub">Add a few entries to reveal your trend.</div>';let a=points.map((p,i)=>({x:24+i*(488/Math.max(1,points.length-1)),y:165-((p.y-minY)/Math.max(1,maxY-minY))*135}));let line=a.map((p,i)=>`${i?'L':'M'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' '),dots=a.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="4" fill="#d9f38b" stroke="#15221a" stroke-width="2"/>`).join('');return `<svg viewBox="0 0 536 195" class="chart" role="img" aria-label="Recorded values trend"><path d="M24,165 H512" stroke="#405348" stroke-width="1" stroke-dasharray="4 6"/><path d="M24,30 H512" stroke="#405348" stroke-width="1" stroke-dasharray="4 6"/>${fill?`<path d="${line} L${a.at(-1).x},165 L24,165Z" fill="#d9f38b1d"/>`:''}<path d="${line}" stroke="#d9f38b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>${dots}<text x="2" y="38" font-size="11" fill="#9fae9f">${maxY.toFixed(1)}</text><text x="2" y="169" font-size="11" fill="#9fae9f">${minY.toFixed(1)}</text></svg>`}
function progressView(){let data=state.weighIns.slice().sort((a,b)=>a.date.localeCompare(b.date)), latest=data.at(-1)?.weight;let running=Object.entries(state.logs).filter(([d,l])=>l.done&&template(d).kind==='run').sort((a,b)=>a[0].localeCompare(b[0]));let speeds=running.filter(([d,l])=>Number(l.run?.speed)>0).map(([d,l])=>({d,y:Number(l.run.speed)}));let runningMax=speeds.length?Math.max(6,...speeds.map(x=>x.y)):6;let weightRange=data.length?{min:Math.min(145,...data.map(x=>Number(x.weight)))-2,max:Math.max(175,...data.map(x=>Number(x.weight)))+2}:{min:145,max:177};return `<div class="section-intro"><div class="eyebrow">The long game</div><h1>Proof of <em>progress.</em></h1><p>Build consistency first, then let trends—not individual workouts—guide your choices.</p></div><div class="grid2"><div class="card"><div class="flex"><div><div class="eyebrow">Body weight</div><h2>${latest??'—'} <span class="thin" style="font-size:16px">${latest?'lb':''}</span></h2></div><span class="pill">Goal 150 lb</span></div><div style="margin-top:9px">${trendSVG(data.map(o=>({y:Number(o.weight)})),true,weightRange.min,weightRange.max)}</div><div class="formgrid" style="margin-top:12px"><div class="field"><label>Weigh-in date</label><input type="date" class="input" id="weight-date" value="${nowToday}"></div><div class="field"><label>Weight (lb)</label><input type="number" min="70" max="600" step="0.1" class="input" id="weight-value" placeholder="e.g. 175"></div></div><button class="btn primary" style="margin-top:12px" data-add-weight="1">Save weigh-in</button></div><div class="card"><div class="eyebrow">Running pace (interval speed)</div><h2>${speeds.length?speeds.at(-1).y.toFixed(1):'—'} <span class="thin" style="font-size:16px">mph logged</span></h2><div style="margin-top:9px">${trendSVG(speeds,true,0,Math.max(6.5,runningMax+.5))}</div><div class="insight"><div class="smallhead">Your long-term goal: 6 mph for 20 continuous minutes</div><div class="sub">Running interval speed alone does not mean you can sustain that pace for two miles. Record longest continuous run to monitor endurance.</div></div></div></div><div class="grid2" style="margin-top:14px"><div class="card"><div class="eyebrow">Weekly activity</div><h2 style="margin-top:7px">Completed workouts</h2><div class="progress-list" style="margin-top:18px">${Array.from({length:Math.max(8,week+1)},(_,w)=>{let count=Array.from({length:7},(_,i)=>getLog(dateAdd(START,w*7+i)).done?1:0).reduce((a,b)=>a+b);return `<div><div class="flex"><span class="sub">Week ${w+1}</span><span class="sub">${count}/7</span></div><div class="bar" style="margin-top:6px"><div class="barfill" style="width:${count/7*100}%"></div></div></div>`}).join('')}</div></div><div class="card"><div class="eyebrow">Recent training</div><h2 style="margin-top:7px">Session history</h2><div class="progress-list" style="margin-top:18px">${Object.entries(state.logs).filter(([d,l])=>l.done).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,12).map(([d,l])=>`<button class="logrow" style="color:inherit;text-align:left;cursor:pointer" data-date="${d}"><span>${pretty(d,{month:'short',day:'numeric',year:'numeric'})} · ${template(d).name}</span><span class="pill done">✓</span></button>`).join('')||'<div class="sub">No completed sessions yet.</div>'}</div></div></div>`}
function libraryView(){return `<div class="section-intro"><div class="eyebrow">One reliable source: PureGym</div><h1>The movement <em>library.</em></h1><p>All demonstrations and written guides below are from PureGym. Videos open on YouTube when the exact demonstration was verified; otherwise we label the variant or link to the written PureGym guide.</p></div><div class="grid2">${Object.entries(EX).map(([id,x])=>`<div class="card"><div class="flex"><div><div class="tag">${x.group}</div><h3 style="margin-top:6px">${e(x.name)}</h3></div><span class="pill">${x.rep[0]}–${x.rep[1]} reps</span></div><p>${e(x.tip)}</p><div class="rowline"><span class="sub">Initial test weight</span><strong>${e(state.trial[id]??x.trial)} lb</strong></div><div class="exlinks" style="margin-top:13px"><a href="${e(x.video||x.extraVideo||x.videoSearch||x.guide)}" target="_blank" rel="noopener noreferrer">↗ ${x.video?'PureGym YouTube demo':x.extraVideo?'YouTube: prone variant':'Search PureGym on YouTube'}</a><a href="${e(x.guide)}" target="_blank" rel="noopener noreferrer">Step-by-step form</a></div>${x.videoNote?`<div class="sub" style="margin-top:7px">${e(x.videoNote)}</div>`:''}${x.extraVideoNote?`<div class="sub" style="margin-top:7px">${e(x.extraVideoNote)}</div>`:''}</div>`).join('')}</div>`}
function settingsView(){return `<div class="section-intro"><div class="eyebrow">Make it yours</div><h1>Your data, <em>your pace.</em></h1><p>The tracker runs in your browser. Everything is stored on this device unless you export a backup.</p></div><div class="grid2"><div class="card"><h2>Backup and restore</h2><p>Export your workout logs to JSON. Import later on another device or after clearing browser data. Files are not uploaded to a server.</p><div class="bottom-actions"><button class="btn primary" data-export="1">↓ Export my data</button><button class="btn secondary" data-import="1">↑ Import backup</button></div><input type="file" accept="application/json,.json" id="import-file" hidden><div class="rule"></div><h3>Calendar anchor</h3><p class="sub">Week 1 begins Sunday, October 25, 2026. Your first Just Run session is pre-marked complete. Future weeks retain the same Sunday–Saturday structure.</p></div><div class="card"><h2>Weight recommendations</h2><p>Each machine begins with a conservative <b style="color:var(--ink)">test load</b>. Pick a lighter weight if the suggestion is strenuous, and avoid maximum-effort testing.</p><div class="rowline"><span class="sub">All sets reach top of rep range + comfortable effort</span><span class="pill">+1 increment</span></div><div class="rowline"><span class="sub">Reps below range or last set too hard</span><span class="pill red">−1 increment</span></div><div class="rowline"><span class="sub">Reps in range / appropriate effort</span><span class="pill">Hold</span></div><div class="rowline"><span class="sub">Pain or unusual symptoms</span><span class="pill red">Stop + review</span></div><div class="note warning">Machines have different pulley ratios, lever arms, and markings. Weight numbers are not interchangeable between machines. For plate-loaded equipment, record the load as consistently as possible.</div></div><div class="card"><h2>Recovery and surgery</h2><p>Given your medical history and scheduled thyroid surgery, confirm the full resistance and rowing program with your care team. Surgery is planned for December 1, 2026; pause lifting and strenuous cardio until cleared.</p><p class="sub">No workout streak penalty. Recovery is part of the plan.</p></div><div class="card"><h2>Start fresh</h2><p>Export your data first. Reset removes workouts and weigh-ins only from this browser.</p><button class="btn secondary" data-reset="1">Reset all progress</button></div></div>`}
function render(){let views={today:todayView,progress:progressView,library:libraryView,settings:settingsView};document.getElementById('app').innerHTML=header()+(views[tab]||todayView)()+`<footer class="foot">FORM · Personal training journal · Built for gradual progress, not medical monitoring · All times local to your device</footer>`+bottomNav()}
function setLogField(target,value){let paths=target.split('.'),o=ensure(selected);for(let i=0;i<paths.length-1;i++){o[paths[i]]??={};o=o[paths[i]]}o[paths.at(-1)]=value;save()}
function finish(){let p=template(selected),log=ensure(selected);if(p.kind==='strength'){let entries=Object.values(log.strength||{}).flatMap(x=>x.sets||[]).filter(x=>x.reps!==''&&Number(x.reps)>0&&x.weight!==''&&Number(x.weight)>=0);if(!entries.length){notice('Enter at least one completed lifting set first.');return}}
if(p.kind==='run'&&log.run?.feel==='pain'){notice('Unusual symptoms? Do not push onward; seek medical guidance if needed.');return}
log.done=true;log.skipped=false;save();render();notice('Session saved ✓')}
function download(name,content,type){let blob=new Blob([content],{type}),a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
document.addEventListener('click',evt=>{let el=evt.target.closest('button');if(!el)return;
if(el.dataset.nav){tab=el.dataset.nav;render();window.scrollTo({top:0,behavior:'smooth'});return}
if(el.dataset.week){week=Math.max(0,Math.min(51,week+Number(el.dataset.week)));selected=dateAdd(START,week*7);render();return}
if(el.dataset.date){setDate(el.dataset.date);return}
if(el.dataset.today){const off=Math.round((dateObj(nowToday)-dateObj(START))/dayMS);selected=off>=0?nowToday:START;week=Math.max(0,Math.floor(off/7));render();return}
if(el.dataset.finish){finish();return}
if(el.dataset.skip){let l=ensure(selected);if(l.skipped){l.skipped=false}else{l.done=false;l.skipped=true}save();render();notice(l.skipped?'Day skipped — progress is flexible.':'Skip removed.');return}
if(el.dataset.addWeight){let d=document.getElementById('weight-date')?.value,v=parseFloat(document.getElementById('weight-value')?.value);if(!d||!Number.isFinite(v)||v<70||v>600){notice('Enter a valid date and weight.');return}state.weighIns=state.weighIns.filter(x=>x.date!==d);state.weighIns.push({date:d,weight:v});state.weighIns.sort((a,b)=>a.date.localeCompare(b.date));save();render();notice('Weigh-in saved.');return}
if(el.dataset.export){download('form-training-backup-'+nowToday+'.json',JSON.stringify({app:'FORM',version:1,exported:nowToday,state},null,2),'application/json');return}
if(el.dataset.import){document.getElementById('import-file')?.click();return}
if(el.dataset.reset){if(confirm('Reset all training logs and weigh-ins? You cannot undo this without a backup.')){state=defaultState();save();selected=START;week=0;tab='today';render();notice('Training progress reset.') }return}
});
document.addEventListener('change',ev=>{let a=ev.target;
if(a.id==='import-file'){let file=a.files?.[0];if(!file)return;file.text().then(s=>{try{let o=JSON.parse(s);let x=o.state??o;if(!x.logs||!Array.isArray(x.weighIns)||typeof x.logs!=='object')throw new Error('Invalid backup');if(!confirm('Replace all current logs with the imported backup?'))return;state={...defaultState(),...x};save();tab='today';render();notice('Backup restored successfully.')}catch(err){notice('Import failed: not a valid FORM backup.')}});return}
if(a.dataset.trial){let v=Number(a.value);if(!Number.isFinite(v)||v<0){notice('Enter a valid weight.');return}state.trial[a.dataset.trial]=v;save();render();notice('First-session test weight updated.');return}
if(a.dataset.effort){let log=ensure(selected);log.strength??={};log.strength[a.dataset.effort]??={sets:[]};log.strength[a.dataset.effort].effort=a.value;save();return}
});
document.addEventListener('input',ev=>{let a=ev.target;
if(a.dataset.fieldLog){setLogField(a.dataset.fieldLog,a.value);return}
if(a.dataset.lift){let id=a.dataset.lift,n=Number(a.dataset.set),log=ensure(selected);log.strength??={};log.strength[id]??={sets:[]};log.strength[id].sets??=[];log.strength[id].sets[n]??={};log.strength[id].sets[n][a.dataset.field]=a.value;if(a.dataset.field==="reps"&&log.strength[id].sets[n].weight===undefined){let weightEl=document.querySelector(`[data-lift="${id}"][data-set="${n}"][data-field="weight"]`);if(weightEl)log.strength[id].sets[n].weight=weightEl.value;}save();return}
});
render();
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
</script>
</body>
