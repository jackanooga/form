<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#002244" />
  <meta name="description" content="Simple workout tracker for running, rowing, and machine strength training." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <title>FORM</title>
  <style>
    :root{
      color-scheme:dark;
      --navy:#002244;
      --navy-2:#0b2c53;
      --green:#69BE28;
      --green-2:#8de04f;
      --gray:#a5acaf;
      --bg:#011627;
      --panel:#07213d;
      --panel-2:#0d2d51;
      --line:rgba(255,255,255,.1);
      --text:#f3f7fa;
      --muted:#aeb9c5;
      --danger:#ff8f8f;
      --shadow:0 12px 40px rgba(0,0,0,.28);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif;
    }
    *{box-sizing:border-box}
    html,body{margin:0;background:linear-gradient(180deg,#00172d 0%,#021a33 55%,#021522 100%);color:var(--text)}
    body{min-height:100vh}
    a{color:var(--green-2);text-decoration:none}
    button,input,textarea,select{font:inherit}
    button{cursor:pointer}
    .app{max-width:760px;margin:0 auto;padding:18px 16px 96px}
    .top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px}
    .brand{display:flex;align-items:center;gap:12px}
    .logo{width:46px;height:46px;border-radius:14px;background:#c7e87a;color:#0c223f;display:grid;place-items:center;font-weight:900;font-size:28px}
    .brand h1{margin:0;font-size:34px;letter-spacing:.12em;line-height:1}
    .sub{margin-top:4px;font-size:12px;color:var(--muted);letter-spacing:.18em;text-transform:uppercase}
    .datebox{text-align:right;color:var(--muted);font-size:12px;letter-spacing:.16em;text-transform:uppercase}
    .datebox strong{display:block;margin-top:6px;color:var(--text);font-size:28px;letter-spacing:-.04em;text-transform:none}
    .card{background:linear-gradient(180deg,rgba(13,45,81,.98),rgba(7,33,61,.97));border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:18px}
    .hero{padding:22px 18px 18px;background:
      linear-gradient(90deg,rgba(2,21,46,.96) 0%,rgba(2,21,46,.87) 52%,rgba(2,21,46,.50) 100%),
      radial-gradient(circle at 85% 10%,rgba(105,190,40,.18),transparent 28%),
      linear-gradient(180deg,#0b2c53,#031a33)}
    .eyebrow{color:#b8ef93;font-size:12px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;margin-bottom:8px}
    .todayTitle{font-size:54px;line-height:.94;font-weight:900;letter-spacing:-.06em;margin:0}
    .todaySub{font-size:22px;font-weight:800;margin:8px 0 0;color:#eef4f8}
    .badges{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 10px}
    .pill{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:999px;background:rgba(105,190,40,.14);border:1px solid rgba(105,190,40,.28);color:#cbf3ad;font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
    .pill.gray{background:rgba(165,172,175,.08);border-color:rgba(255,255,255,.08);color:#dce3ea}
    .meta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
    .meta .item{background:rgba(255,255,255,.03);border:1px solid var(--line);padding:12px;border-radius:18px}
    .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.16em;font-weight:700}
    .value{font-size:28px;font-weight:900;letter-spacing:-.04em;margin-top:4px}
    .value.small{font-size:20px}
    .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
    .btn{border:0;border-radius:18px;padding:16px 18px;font-weight:900;font-size:18px;background:var(--green);color:#03213e;box-shadow:var(--shadow)}
    .btn.secondary{background:transparent;border:1px solid var(--line);color:var(--text);box-shadow:none}
    .btn.small{padding:10px 13px;font-size:14px;border-radius:14px}
    .stack{display:flex;flex-direction:column;gap:14px;margin-top:14px}
    .split{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .mini-title{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.18em;font-weight:800}
    .next-title{font-size:30px;font-weight:900;letter-spacing:-.04em;margin-top:6px}
    .week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
    .daybtn{border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:18px;padding:12px 6px;color:var(--text);min-height:96px}
    .daybtn.active{border-color:rgba(105,190,40,.55);background:rgba(105,190,40,.1)}
    .daybtn.done .statusDot{background:var(--green)}
    .daybtn.skip .statusDot{background:var(--danger)}
    .statusDot{display:block;width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.18);margin:8px auto 0}
    .dayname{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;font-weight:800}
    .daynum{font-size:24px;font-weight:900;margin-top:4px}
    .daymark{font-size:11px;color:var(--muted);margin-top:4px}
    .section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
    .section-title h2{margin:0;font-size:24px;letter-spacing:-.03em}
    .field{display:flex;flex-direction:column;gap:6px}
    .field label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.14em;font-weight:700}
    .input{width:100%;background:#061a31;border:1px solid rgba(255,255,255,.12);border-radius:14px;color:var(--text);padding:13px 14px;outline:none}
    .input:focus{border-color:rgba(105,190,40,.5)}
    .form2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .exercise{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:18px;padding:14px}
    .exercise h3{margin:0;font-size:18px}
    .exercise .subline{margin-top:4px;color:var(--muted);font-size:13px}
    .rec{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;background:rgba(105,190,40,.08);border:1px solid rgba(105,190,40,.2);border-radius:14px;padding:12px;margin:12px 0}
    .rec strong{display:block;color:#c9f7a7;font-size:26px;letter-spacing:-.04em}
    .rec span{font-size:12px;color:#c6d2db;line-height:1.35;max-width:280px;text-align:right}
    .setgrid{display:grid;grid-template-columns:40px 1fr 1fr;gap:8px;margin-top:10px}
    .setgrid .setno{display:grid;place-items:center;color:var(--muted);font-size:12px;font-weight:800}
    .effortRow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
    .toggle{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}
    .toggle input{accent-color:var(--green)}
    .links{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:14px;font-weight:700}
    .muted{color:var(--muted)}
    .footerSpace{height:12px}
    .nav{position:fixed;left:0;right:0;bottom:0;background:rgba(1,18,35,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:10px 10px calc(10px + env(safe-area-inset-bottom));z-index:30}
    .nav .inner{width:min(760px,100%);display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
    .nav button{background:none;border:0;color:var(--muted);padding:8px 4px;font-weight:800;font-size:12px}
    .nav button.active{color:var(--green-2)}
    .nav .icon{display:block;font-size:18px;margin-bottom:3px}
    .toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#c7e87a;color:#07213d;font-weight:900;padding:12px 16px;border-radius:14px;box-shadow:var(--shadow);z-index:40;max-width:90%;text-align:center}
    .hide{display:none!important}
    @media (max-width:650px){
      .app{padding:16px 14px 96px}
      .todayTitle{font-size:48px}
      .meta,.split,.form2,.effortRow{grid-template-columns:1fr}
      .week-grid{gap:6px}
      .daybtn{min-height:86px;padding:10px 4px}
      .daynum{font-size:20px}
      .datebox strong{font-size:22px}
      .brand h1{font-size:28px}
      .rec{flex-direction:column}
      .rec span{text-align:left;max-width:none}
    }
  </style>
</head>
<body>
<div class="app" id="app"></div>
<div class="nav" id="nav"></div>
<div class="toast hide" id="toast"></div>
<script>
const START='2026-10-25', KEY='form_tracker_v1', DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const EX={
 chest:{name:'Machine chest press',group:'Chest',rep:[8,12],step:5,trial:20,tip:'Back supported. Press with control.',video:'https://www.youtube.com/watch?v=sqNwDkUU_Ps',guide:'https://www.puregym.com/exercises/chest/bench-press/seated-chest-press/'},
 row:{name:'Seated row machine',group:'Back',rep:[8,12],step:5,trial:25,tip:'Pull elbows back. Keep torso still.',video:'https://www.youtube.com/watch?v=TeFo51Q_Nsc',guide:'https://www.puregym.com/lets-get-started/workout-builder/equipment-how-tos/'},
 incline:{name:'Incline chest press machine',group:'Upper chest',rep:[8,12],step:5,trial:15,tip:'Use a comfortable range.',video:'https://www.youtube.com/watch?v=sqNwDkUU_Ps',guide:'https://www.puregym.com/exercises/chest/bench-press/seated-chest-press/'},
 lat:{name:'Lat pulldown',group:'Back',rep:[8,12],step:5,trial:25,tip:'Pull to upper chest, no yanking.',video:'https://www.youtube.com/watch?v=JGeRYIZdojU',guide:'https://www.puregym.com/exercises/back/lat-exercises/lat-pulldown/'},
 legpress:{name:'Seated leg press',group:'Legs',rep:[10,12],step:10,trial:40,tip:'Feet flat. Don’t lock knees.',video:'https://www.youtube.com/watch?v=qCR9bN3G1t4',guide:'https://www.puregym.com/exercises/legs/quad-exercises/leg-presses/seated-leg-press/'},
 legcurl:{name:'Seated leg curl',group:'Hamstrings',rep:[10,12],step:5,trial:20,tip:'Keep hips planted.',video:'https://www.youtube.com/watch?v=QjNFk4F5dAs',guide:'https://www.puregym.com/exercises/legs/hamstring-exercises/hamstring-curls/seated-leg-curl/'},
 triceps:{name:'Cable triceps pushdown',group:'Triceps',rep:[10,15],step:5,trial:10,tip:'Elbows stay pinned.',video:'https://www.youtube.com/watch?v=LXkCrxn3caQ',guide:'https://www.puregym.com/exercises/arms-and-shoulders/tricep-extension/tricep-pushdowns/'},
 fly:{name:'Pec deck / machine fly',group:'Chest',rep:[10,15],step:5,trial:15,tip:'Smooth range. No deep painful stretch.',video:'https://www.youtube.com/watch?v=tVtP3hnBPts',guide:'https://www.puregym.com/exercises/chest/chest-flyes/pec-dec/'},
 lateral:{name:'Machine lateral raise',group:'Shoulders',rep:[12,15],step:5,trial:10,tip:'Raise with control, no shrugging.',video:'https://www.youtube.com/watch?v=3VcKaXpzqRo',guide:'https://www.puregym.com/exercises/arms-and-shoulders/shoulder-press-exercises/shoulder-lateral-raise/'},
 biceps:{name:'Machine biceps curl',group:'Biceps',rep:[10,15],step:5,trial:10,tip:'Curl without swinging.',video:'https://www.youtube.com/watch?v=J4qYk1A_aZk',guide:'https://www.puregym.com/exercises/arms-and-shoulders/bicep-exercises/bicep-curl-machine/'}
};
const PLANS={A:[['chest',3],['row',3],['incline',2],['lat',2],['legpress',2],['legcurl',2],['triceps',2]],B:[['incline',3],['lat',3],['fly',2],['row',2],['lateral',2],['legpress',2],['legcurl',2],['biceps',2]]};
const SCHEDULE=[{name:'Just Run',kind:'run',mark:'Run',duration:'20 min',detail:'Just Run #1',type:'Run'},{name:'Workout A + Easy Row',kind:'strength',plan:'A',mark:'Lift',duration:'45 min',detail:'Workout A',type:'Strength + easy row'},{name:'Just Run',kind:'run',mark:'Run',duration:'20 min',detail:'Just Run #2',type:'Run'},{name:'Recovery',kind:'rest',mark:'Rest',duration:'—',detail:'Recovery',type:'Recovery'},{name:'Workout B + Easy Row',kind:'strength',plan:'B',mark:'Lift',duration:'45 min',detail:'Workout B',type:'Strength + easy row'},{name:'Just Run',kind:'run',mark:'Run',duration:'20 min',detail:'Just Run #3',type:'Run'},{name:'Recovery',kind:'rest',mark:'Rest',duration:'—',detail:'Recovery',type:'Recovery'}];
const dayMS=86400000;
const iso=d=>new Date(d).toISOString().slice(0,10);
const dateAdd=(ymd,n)=>iso(new Date(ymd+'T12:00:00Z').getTime()+n*dayMS);
const dateObj=ymd=>new Date(ymd+'T12:00:00Z');
const pretty=(ymd,opt={month:'short',day:'numeric'})=>dateObj(ymd).toLocaleDateString('en-US',{timeZone:'UTC',...opt});
const longDate=ymd=>pretty(ymd,{month:'long',day:'numeric',year:'numeric'});
function defaultState(){return {logs:{'2026-10-25':{done:true,run:{speed:'4.5',notes:'First Just Run session completed; 4 mph felt too slow, increased intervals to 4.5 mph.'}}},weighIns:[],trial:{},paused:false}}
function load(){try{let o=JSON.parse(localStorage.getItem(KEY));if(o&&typeof o==='object'&&o.logs&&Array.isArray(o.weighIns))return o}catch(e){}return defaultState()}
let state=load();state.trial??={};
const localNow=new Date();
const nowToday=[localNow.getFullYear(),String(localNow.getMonth()+1).padStart(2,'0'),String(localNow.getDate()).padStart(2,'0')].join('-');
let selected=nowToday>=START?nowToday:START;
let week=Math.max(0,Math.floor((dateObj(selected)-dateObj(START))/dayMS/7));
let tab='today',toastTimer=null;
const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
const getLog=d=>state.logs[d]||{};
function ensure(d){state.logs[d]??={};return state.logs[d]}
function template(d){let offset=Math.round((dateObj(d)-dateObj(START))/dayMS);let idx=((offset%7)+7)%7;let t={...SCHEDULE[idx]};if(t.kind==='run')t.detail='Just Run #'+runNumber(d);return t}
function runNumber(d){const offset=Math.round((dateObj(d)-dateObj(START))/dayMS);return Math.floor(offset/7)*3 + ({0:1,2:2,5:3}[offset%7]||0)}
function e(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function notice(msg){let t=document.getElementById('toast');t.textContent=msg;t.classList.remove('hide');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.add('hide'),2600)}
function pastHistory(id,d){let arr=[];for(const [date,l] of Object.entries(state.logs)){if(date>=d||!l.done||!l.strength?.[id])continue;const x=l.strength[id];const filled=(x.sets||[]).filter(s=>Number(s.weight)>=0&&s.weight!==''&&Number(s.reps)>0);if(filled.length)arr.push({date,sets:filled,effort:x.effort||'right'})}return arr.sort((a,b)=>b.date.localeCompare(a.date))}
function roundStep(n,step){return Math.max(step,Math.round(n/step)*step)}
function recommended(id,d){const x=EX[id],trial=Number(state.trial[id]??x.trial),hist=pastHistory(id,d);if(!hist.length)return {weight:trial,why:'Start here'};let last=hist[0],base=Number(last.sets[last.sets.length-1].weight),reps=last.sets.map(s=>Number(s.reps));let allTop=reps.every(v=>v>=x.rep[1]),low=reps.some(v=>v<x.rep[0]);let newWeight=base,why='Hold';if(last.effort==='pain'){why='Pain logged'}else if(low||last.effort==='hard'){newWeight=Math.max(x.step,base-x.step);why='Last time was hard'}else if(allTop&&last.effort!=='hard'){newWeight=base+x.step;why='All sets hit top reps'}else{why='Stay here'}return {weight:roundStep(newWeight,x.step),why}}
function setDate(d){selected=d;week=Math.max(0,Math.floor((dateObj(d)-dateObj(START))/dayMS/7));tab='today';render();window.scrollTo({top:0,behavior:'smooth'})}
function weekStart(){return dateAdd(START,week*7)}
function weekDone(){let c=0;for(let i=0;i<7;i++){if(getLog(dateAdd(weekStart(),i)).done)c++}return c}
function nav(){return `<div class="inner">${navBtn('today','⌂','Today')}${navBtn('week','◫','Week')}${navBtn('lifts','✦','Lifts')}${navBtn('settings','⚙','Settings')}</div>`}
function navBtn(id,icon,label){return `<button data-nav="${id}" class="${tab===id?'active':''}"><span class="icon">${icon}</span>${label}</button>`}
function header(){return `<div class="top"><div class="brand"><div class="logo">F</div><div><h1>FORM</h1><div class="sub">A little stronger every day</div></div></div><div class="datebox">${template(selected).kind==='rest'?'Recovery day':'Today'}<strong>${pretty(selected,{weekday:'short',month:'short',day:'numeric'})}</strong></div></div>`}
function heroCard(){const t=template(selected),log=getLog(selected),done=!!log.done;return `<div class="card hero"><div class="eyebrow">Today's workout</div><h2 class="todayTitle">${e(dateObj(selected).toLocaleDateString('en-US',{timeZone:'UTC',weekday:'long'}))}</h2><div class="todaySub">${e(t.detail)}</div><div class="badges">${done?'<div class="pill">✓ Completed</div>':''}<div class="pill gray">${e(t.type)}</div><div class="pill gray">${e(t.duration)}</div></div><div class="meta"><div class="item"><div class="label">Main goal</div><div class="value small">Stay consistent</div></div><div class="item"><div class="label">Week</div><div class="value">${week+1}</div></div><div class="item"><div class="label">Done</div><div class="value">${weekDone()}/7</div></div></div></div>`}
function weekStrip(){const start=weekStart();return `<div class="card"><div class="section-title"><h2>This week</h2><div class="row"><button class="btn small secondary" data-week="-1">←</button><button class="btn small secondary" data-today="1">Today</button><button class="btn small secondary" data-week="1">→</button></div></div><div class="week-grid">${Array.from({length:7},(_,i)=>{const d=dateAdd(start,i),t=template(d),l=getLog(d),cls=[d===selected?'active':'',l.done?'done':'',l.skipped?'skip':''].join(' ');return `<button class="daybtn ${cls}" data-date="${d}"><div class="dayname">${DOW[i]}</div><div class="daynum">${pretty(d,{day:'numeric'})}</div><div class="daymark">${e(t.mark)}</div><span class="statusDot"></span></button>`}).join('')}</div></div>`}
function runSection(){const log=ensure(selected);log.run??={speed:'',notes:''};return `<div class="card"><div class="section-title"><h2>Log run</h2><button class="btn small secondary" data-skip="1">${getLog(selected).skipped?'Undo skip':'Skip day'}</button></div><div class="form2"><div class="field"><label>Interval speed (mph)</label><input class="input" type="number" step="0.1" data-fieldlog="run.speed" value="${e(log.run.speed||'')}" placeholder="5.0"></div><div class="field"><label>Notes</label><input class="input" data-fieldlog="run.notes" value="${e(log.run.notes||'')}" placeholder="How did it feel?"></div></div><div class="row" style="margin-top:14px"><button class="btn" data-finish="1">Mark complete</button></div></div>`}
function restSection(){const log=ensure(selected);log.rest??={notes:''};return `<div class="card"><div class="section-title"><h2>Recovery</h2><button class="btn small secondary" data-skip="1">${getLog(selected).skipped?'Undo skip':'Skip day'}</button></div><div class="field"><label>Notes</label><input class="input" data-fieldlog="rest.notes" value="${e(log.rest.notes||'')}" placeholder="Walk, stretch, rest, etc."></div><div class="row" style="margin-top:14px"><button class="btn" data-finish="1">Mark complete</button></div></div>`}
function strengthSection(){const t=template(selected),plan=PLANS[t.plan],log=ensure(selected);log.strength??={};log.row??={minutes:log.row?.minutes||'10'};return `<div class="stack"><div class="card"><div class="section-title"><h2>${e(t.detail)}</h2><button class="btn small secondary" data-skip="1">${getLog(selected).skipped?'Undo skip':'Skip day'}</button></div><div class="muted">Log the lifts. Keep the easy row easy.</div></div>${plan.map(([id,sets])=>exerciseCard(id,sets,log)).join('')}<div class="card"><div class="section-title"><h2>Easy row</h2></div><div class="form2"><div class="field"><label>Minutes</label><input class="input" type="number" min="0" max="60" data-fieldlog="row.minutes" value="${e(log.row.minutes||'10')}"></div><div class="field"><label>Notes</label><input class="input" data-fieldlog="row.notes" value="${e(log.row.notes||'')}" placeholder="Easy effort"></div></div><div class="row" style="margin-top:14px"><button class="btn" data-finish="1">Mark complete</button></div></div></div>`}
function exerciseCard(id,sets,log){const ex=EX[id],rec=recommended(id,selected);log.strength[id]??={sets:[],effort:'right'};return `<div class="exercise"><h3>${e(ex.name)}</h3><div class="subline">${ex.rep[0]}–${ex.rep[1]} reps · ${e(ex.group)}</div><div class="rec"><div><div class="label">Recommended weight</div><strong>${rec.weight} lb</strong></div><span>${e(rec.why)}</span></div><div class="setgrid">${Array.from({length:sets},(_,i)=>{const s=log.strength[id].sets[i]||{};return `<div class="setno">${i+1}</div><input class="input" type="number" min="0" step="1" placeholder="lb" data-lift="${id}" data-set="${i}" data-field="weight" value="${e(s.weight??'')}"><input class="input" type="number" min="0" step="1" placeholder="reps" data-lift="${id}" data-set="${i}" data-field="reps" value="${e(s.reps??'')}">`}).join('')}</div><div class="effortRow"><div class="field"><label>Effort</label><select class="input" data-effort="${id}"><option value="easy" ${log.strength[id].effort==='easy'?'selected':''}>Easy</option><option value="right" ${(!log.strength[id].effort||log.strength[id].effort==='right')?'selected':''}>Right</option><option value="hard" ${log.strength[id].effort==='hard'?'selected':''}>Hard</option><option value="pain" ${log.strength[id].effort==='pain'?'selected':''}>Pain</option></select></div><div class="field"><label>Test weight</label><input class="input" type="number" min="0" step="1" value="${e(state.trial[id]??ex.trial)}" data-trial="${id}"></div></div><div class="links"><a href="${e(ex.video)}" target="_blank" rel="noopener noreferrer">YouTube form</a><a href="${e(ex.guide)}" target="_blank" rel="noopener noreferrer">Written guide</a></div></div>`}
function nextCard(){const d=dateAdd(selected,1),t=template(d);return `<div class="card"><div class="mini-title">Up next</div><div class="next-title">${e(dateObj(d).toLocaleDateString('en-US',{timeZone:'UTC',weekday:'long'}))}</div><div class="todaySub" style="font-size:18px;margin-top:4px">${e(t.detail)}</div></div>`}
function todayView(){const t=template(selected);return header()+heroCard()+`<div class="footerSpace"></div>`+weekStrip()+`<div class="footerSpace"></div>`+(t.kind==='run'?runSection():t.kind==='strength'?strengthSection():restSection())+`<div class="footerSpace"></div>`+nextCard()}
function weekView(){const start=weekStart();return header()+`<div class="card"><div class="section-title"><h2>Week ${week+1}</h2><div class="muted">${weekDone()}/7 done</div></div><div class="stack">${Array.from({length:7},(_,i)=>{const d=dateAdd(start,i),t=template(d),l=getLog(d);return `<button class="card" style="text-align:left;padding:16px" data-date="${d}"><div class="mini-title">${DOW[i]} · ${pretty(d,{month:'short',day:'numeric'})}</div><div class="next-title" style="font-size:28px;margin-top:8px">${e(t.detail)}</div><div class="row" style="margin-top:10px"><div class="pill gray">${e(t.type)}</div>${l.done?'<div class="pill">✓ Completed</div>':''}${l.skipped?'<div class="pill gray">Skipped</div>':''}</div></button>`}).join('')}</div></div>`}
function liftsView(){return header()+`<div class="stack">${Object.entries(EX).map(([id,ex])=>`<div class="exercise"><h3>${e(ex.name)}</h3><div class="subline">${ex.rep[0]}–${ex.rep[1]} reps · ${e(ex.group)}</div><div class="form2" style="margin-top:12px"><div class="field"><label>Default test weight</label><input class="input" type="number" min="0" step="1" data-trial="${id}" value="${e(state.trial[id]??ex.trial)}"></div><div class="field"><label>Weight step</label><input class="input" value="${e(ex.step)} lb" disabled></div></div><div class="links"><a href="${e(ex.video)}" target="_blank" rel="noopener noreferrer">YouTube form</a><a href="${e(ex.guide)}" target="_blank" rel="noopener noreferrer">Written guide</a></div></div>`).join('')}</div>`}
function settingsView(){const latest=state.weighIns[state.weighIns.length-1];return header()+`<div class="stack"><div class="card"><div class="section-title"><h2>Weight</h2></div><div class="form2"><div class="field"><label>Date</label><input class="input" id="weight-date" type="date" value="${nowToday}"></div><div class="field"><label>Body weight (lb)</label><input class="input" id="weight-value" type="number" step="0.1" min="70" max="600" placeholder="175"></div></div><div class="row" style="margin-top:14px"><button class="btn" data-addweight="1">Save weigh-in</button>${latest?`<div class="muted">Latest: ${latest.weight} lb on ${pretty(latest.date,{month:'short',day:'numeric'})}</div>`:''}</div></div><div class="card"><div class="section-title"><h2>Backup</h2></div><div class="row"><button class="btn" data-export="1">Export</button><button class="btn secondary" data-import="1">Import</button><input type="file" id="import-file" accept="application/json,.json" hidden></div></div><div class="card"><div class="section-title"><h2>Reset</h2></div><button class="btn secondary" data-reset="1">Reset all data</button></div></div>`}
function render(){document.getElementById('app').innerHTML=(tab==='today'?todayView():tab==='week'?weekView():tab==='lifts'?liftsView():settingsView());document.getElementById('nav').innerHTML=nav()}
function setLogField(path,value){const parts=path.split('.');let o=ensure(selected);for(let i=0;i<parts.length-1;i++){o[parts[i]]??={};o=o[parts[i]]}o[parts.at(-1)]=value;save()}
function finish(){const t=template(selected),log=ensure(selected);if(t.kind==='strength'){const entries=Object.values(log.strength||{}).flatMap(x=>x.sets||[]).filter(s=>Number(s.weight)>=0&&s.weight!==''&&Number(s.reps)>0);if(!entries.length){notice('Add at least one completed set first.');return}}log.done=true;log.skipped=false;save();render();notice('Saved')}
document.addEventListener('click',ev=>{const btn=ev.target.closest('button');if(!btn)return;
  if(btn.dataset.nav){tab=btn.dataset.nav;render();window.scrollTo({top:0,behavior:'smooth'});return}
  if(btn.dataset.date){setDate(btn.dataset.date);return}
  if(btn.dataset.week){week=Math.max(0,Math.min(52,week+Number(btn.dataset.week)));selected=dateAdd(START,week*7);tab='week';render();return}
  if(btn.dataset.today){selected=nowToday>=START?nowToday:START;week=Math.max(0,Math.floor((dateObj(selected)-dateObj(START))/dayMS/7));tab='today';render();return}
  if(btn.dataset.finish){finish();return}
  if(btn.dataset.skip){let l=ensure(selected);if(l.skipped){l.skipped=false}else{l.done=false;l.skipped=true}save();render();notice(l.skipped?'Skipped':'Skip removed');return}
  if(btn.dataset.addweight){let d=document.getElementById('weight-date').value,v=parseFloat(document.getElementById('weight-value').value);if(!d||!Number.isFinite(v)||v<70||v>600){notice('Enter a valid weight');return}state.weighIns=state.weighIns.filter(x=>x.date!==d);state.weighIns.push({date:d,weight:v});state.weighIns.sort((a,b)=>a.date.localeCompare(b.date));save();render();notice('Weigh-in saved');return}
  if(btn.dataset.export){let blob=new Blob([JSON.stringify({app:'FORM',version:2,state},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='form-backup-'+nowToday+'.json';document.body.appendChild(a);a.click();a.remove();notice('Exported');return}
  if(btn.dataset.import){document.getElementById('import-file').click();return}
  if(btn.dataset.reset){if(confirm('Reset all progress?')){state=defaultState();save();selected=START;week=0;tab='today';render();notice('Reset complete')}return}
});
document.addEventListener('input',ev=>{const a=ev.target;if(a.dataset.fieldlog){setLogField(a.dataset.fieldlog,a.value);return}if(a.dataset.lift){const id=a.dataset.lift,n=Number(a.dataset.set),log=ensure(selected);log.strength??={};log.strength[id]??={sets:[]};log.strength[id].sets[n]??={};log.strength[id].sets[n][a.dataset.field]=a.value;save();return}});
document.addEventListener('change',ev=>{const a=ev.target;if(a.id==='import-file'){const file=a.files?.[0];if(!file)return;file.text().then(txt=>{try{let o=JSON.parse(txt);let x=o.state??o;if(!x.logs||!Array.isArray(x.weighIns))throw new Error('bad');state={...defaultState(),...x};save();render();notice('Imported')}catch(e){notice('Import failed')}});return}if(a.dataset.effort){let log=ensure(selected);log.strength??={};log.strength[a.dataset.effort]??={sets:[]};log.strength[a.dataset.effort].effort=a.value;save();return}if(a.dataset.trial){const v=Number(a.value);if(Number.isFinite(v)&&v>=0){state.trial[a.dataset.trial]=v;save();notice('Updated')}}});
render();
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
</script>
</body>
</html>
